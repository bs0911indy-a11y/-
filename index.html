<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遅刻・欠勤・欠席連絡</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --accent:#2f6feb; --accent-dark:#1f4fb0;
    --text:#1c1e21; --sub:#6b7280; --border:#e3e5e8; --danger:#e05555;
    --group:#0f9d76;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--text); padding:10px 12px 142px;
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .topbar h1{font-size:17px;margin:0;}
  .dots{
    width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);
    background:#fff;font-size:19px;line-height:1;color:var(--sub);
  }
  .card{
    background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;
    box-shadow:0 1px 2px rgba(0,0,0,0.05);
  }
  .lbl{font-size:11px;color:var(--sub);font-weight:600;margin-bottom:6px;}
  .row{display:flex;flex-wrap:wrap;gap:6px;}
  .btn{
    flex:1 1 auto;min-width:0;padding:9px 6px;border-radius:9px;
    border:1.5px solid var(--border);background:#fff;font-size:14px;
    color:var(--text);text-align:center;
  }
  .btn.sel{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600;}
  .btn.type{padding:11px 4px;font-size:15px;font-weight:600;}
  .btn.grp{border-color:var(--group);color:var(--group);font-weight:600;}
  .btn.grp.sel{background:var(--group);border-color:var(--group);color:#fff;}
  select,input[type=text],input[type=email]{
    padding:9px;border-radius:8px;border:1.5px solid var(--border);
    font-size:16px;background:#fff;color:var(--text);
  }
  .time-row{display:flex;align-items:center;gap:8px;}
  .time-row select{flex:1;text-align:center;}
  .colon{font-size:18px;font-weight:700;color:var(--accent-dark);}
  .preview{
    background:#fafbfc;border:1px solid var(--border);border-radius:10px;
    padding:8px 10px;font-size:12px;color:var(--sub);white-space:pre-wrap;line-height:1.5;
    margin-bottom:6px;
  }
  .preview b{color:var(--text);}
  #bodyBox{
    width:100%;min-height:120px;padding:10px;border-radius:10px;
    border:1.5px solid var(--border);font-size:13.5px;line-height:1.6;
    font-family:inherit;color:var(--text);background:#fff;resize:vertical;
  }
  .edit-note{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--sub);margin-top:5px;
  }
  .reset-btn{
    border:1.5px solid var(--border);background:#fff;color:var(--sub);
    border-radius:7px;padding:5px 10px;font-size:11.5px;
  }
  .sendbar{
    position:fixed;bottom:0;left:0;right:0;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 65%,transparent);
  }
  .send{
    width:100%;padding:15px;border:none;border-radius:13px;background:var(--accent);
    color:#fff;font-size:16px;font-weight:700;box-shadow:0 3px 10px rgba(47,111,235,.35);
  }
  .send:active{background:var(--accent-dark);}
  .hide{display:none !important;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;}
  .panel{
    background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom));
  }
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .panel-head h2{font-size:16px;margin:0;}
  .close{border:none;background:none;font-size:22px;color:var(--sub);padding:4px 8px;}
  .addr-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .addr-row input{flex:1;font-size:13px;padding:8px;min-width:0;}
  .xbtn{padding:0 10px;height:34px;border:none;border-radius:8px;background:var(--danger);color:#fff;font-size:12px;flex:0 0 auto;}
  .dash{
    width:100%;padding:9px;border-radius:8px;border:1.5px dashed var(--border);
    background:#fafafa;color:var(--sub);font-size:13px;margin-top:4px;
  }
  .gbox{
    border:1.5px solid var(--group);border-radius:10px;padding:10px;margin-bottom:10px;background:#f7fdfb;
  }
  .ghead{display:flex;gap:6px;align-items:center;margin-bottom:8px;}
  .ghead input{flex:1;font-weight:600;font-size:14px;}
  .mem{
    display:flex;justify-content:space-between;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--border);border-radius:8px;
    padding:7px 9px;margin-bottom:5px;font-size:12.5px;
  }
  .mem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mem button{border:none;background:none;color:var(--danger);font-size:16px;flex:0 0 auto;}
  textarea{
    width:100%;min-height:90px;padding:8px;border-radius:8px;
    border:1.5px solid var(--border);font-size:11px;font-family:monospace;
  }
  .util{
    flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--accent);
    background:#fff;color:var(--accent);font-size:13px;font-weight:600;
  }
  .line-row{display:flex;gap:8px;margin-top:8px;}
  .line-btn{
    flex:1;padding:13px 6px;border:none;border-radius:12px;
    background:#06c755;color:#fff;font-size:14px;font-weight:700;
  }
  .line-btn.sub{background:#fff;color:#06c755;border:1.5px solid #06c755;}
  .line-btn:active{opacity:.8;}
</style>
</head>
<body>

<div class="topbar">
  <h1>遅刻・欠勤・欠席連絡</h1>
  <button class="dots" onclick="openPanel()">⋯</button>
</div>

<div class="card">
  <div class="row">
    <button class="btn type sel" data-type="遅刻" onclick="selType('遅刻')">遅刻</button>
    <button class="btn type" data-type="欠勤" onclick="selType('欠勤')">欠勤</button>
    <button class="btn type" data-type="欠席" onclick="selType('欠席')">欠席</button>
  </div>
</div>

<div class="card">
  <div class="lbl">理由</div>
  <div class="row" style="margin-bottom:6px;">
    <button class="btn sel" data-reason="理由なし" onclick="selReason('理由なし')">なし</button>
    <button class="btn" data-reason="私用" onclick="selReason('私用')">私用</button>
    <button class="btn" data-reason="体調不良" onclick="selReason('体調不良')">体調不良</button>
  </div>
  <div class="row">
    <button class="btn" data-reason="電車遅延" onclick="selReason('電車遅延')">電車遅延</button>
    <button class="btn" data-reason="通院" onclick="selReason('通院')">通院</button>
    <button class="btn" data-reason="家庭の事情" onclick="selReason('家庭の事情')">家庭の事情</button>
  </div>
</div>

<div class="card" id="timeCard">
  <div class="lbl">予定（任意）</div>
  <select id="planSel" style="width:100%;margin-bottom:9px;"></select>
  <div class="lbl">出社予定時刻</div>
  <div class="time-row">
    <select id="hourSel"></select>
    <span class="colon">:</span>
    <select id="minSel"></select>
  </div>
</div>

<div class="card hide" id="eventCard">
  <div class="lbl">欠席する会議・行事名（任意）</div>
  <input type="text" id="eventInput" placeholder="例：定例会議" style="width:100%;">
</div>

<div class="card">
  <div class="lbl">宛先</div>
  <div id="toRow" class="row"></div>
  <div class="lbl" style="margin-top:9px;">CC</div>
  <div id="ccRow" class="row"></div>
</div>

<div class="card">
  <div class="row">
    <button class="btn sel" data-apo="あり" onclick="selApo('あり')">謝罪あり</button>
    <button class="btn" data-apo="なし" onclick="selApo('なし')">謝罪なし</button>
  </div>
</div>

<div class="card">
  <div class="preview" id="preview"></div>
  <textarea id="bodyBox" placeholder="本文"></textarea>
  <div class="edit-note">
    <span id="editState">自動生成中（直接編集できます）</span>
    <button class="reset-btn" onclick="resetBody()">自動生成に戻す</button>
  </div>
</div>

<div class="sendbar">
  <button class="send" onclick="sendMail()">この内容でメールを開く</button>
  <div class="line-row">
    <button class="line-btn sub" onclick="copyBody()">本文をコピー</button>
    <button class="line-btn" onclick="sendLine()">LINEで送る</button>
  </div>
</div>

<div class="overlay hide" id="overlay" onclick="if(event.target===this)closePanel()">
  <div class="panel">
    <div class="panel-head">
      <h2>設定</h2>
      <button class="close" onclick="closePanel()">✕</button>
    </div>

    <div class="card">
      <div class="lbl">お名前（冒頭の挨拶に使用）</div>
      <input type="text" id="nameInput" placeholder="例：山田" style="width:100%;">
    </div>

    <div class="card">
      <div class="lbl">宛先グループ（複数人へ一斉送信）</div>
      <div id="groupManage"></div>
      <button class="dash" onclick="addGroup()">＋ グループを新規作成</button>
    </div>

    <div class="card">
      <div class="lbl">個別の宛先</div>
      <div id="addrManage"></div>
      <button class="dash" onclick="addAddr()">＋ 宛先を追加</button>
      <button class="dash" onclick="pickContacts('to')">📱 アドレス帳から選ぶ</button>
    </div>

    <div class="card">
      <div class="lbl">予定の選択肢</div>
      <div id="planManage"></div>
      <button class="dash" onclick="addPlan()">＋ 項目を追加</button>
    </div>

    <div class="card">
      <div class="lbl">CC宛先</div>
      <div id="ccManage"></div>
      <button class="dash" onclick="addCc()">＋ CC宛先を追加</button>
      <button class="dash" onclick="pickContacts('cc')">📱 アドレス帳から選ぶ</button>
    </div>

    <div class="card">
      <div class="lbl">バックアップ（名前・宛先・グループ・CC）</div>
      <div class="row" style="margin-bottom:8px;">
        <button class="util" onclick="doExport()">エクスポート</button>
        <button class="util" onclick="doImport()">インポート</button>
      </div>
      <textarea id="ioBox" placeholder="「エクスポート」で設定がここに出ます。控えておき、復元時は貼り付けて「インポート」。"></textarea>
      <button class="dash" onclick="copyBox()">📋 コピー</button>
    </div>
  </div>
</div>

<script>
let st = {
  type:"遅刻", reason:"理由なし", hour:"", minute:"",
  addresses:[], selTo:[], groups:[], selGroups:[],
  ccAddresses:[], selCc:[],
  name:"", event:"", apo:"あり",
  plan:"", plans:[], bodyEdited:false,
  warnMail:false, warnLine:false
};
const DEFAULT_PLANS = ['ミーティング','朝礼','定例会議','研修','打ち合わせ'];

/* ---- 保存 ---- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function saveAddr(){ lsSet('addresses', JSON.stringify(st.addresses)); }
function saveCc(){ lsSet('ccAddresses', JSON.stringify(st.ccAddresses)); }
function saveGroups(){ lsSet('groups', JSON.stringify(st.groups)); }
function savePlans(){ lsSet('plans', JSON.stringify(st.plans)); }

function loadAll(){
  const n = lsGet('userName');
  if(n){ st.name = n; document.getElementById('nameInput').value = n; }
  try{ const a = lsGet('addresses'); if(a) st.addresses = JSON.parse(a); }catch(e){}
  if(!st.addresses.length) st.addresses = [{label:"宛先1", email:""}];
  st.selTo = [st.addresses[0]];
  try{ const c = lsGet('ccAddresses'); if(c) st.ccAddresses = JSON.parse(c); }catch(e){}
  try{ const g = lsGet('groups'); if(g) st.groups = JSON.parse(g); }catch(e){}
  try{ const pl = lsGet('plans'); if(pl) st.plans = JSON.parse(pl); }catch(e){}
  if(!Array.isArray(st.plans) || !st.plans.length) st.plans = DEFAULT_PLANS.slice();
  buildPlanSelect();
  renderTo(); renderCc();
}

/* ---- パネル ---- */
function openPanel(){
  document.getElementById('overlay').classList.remove('hide');
  renderAddrManage(); renderCcManage(); renderGroupManage(); renderPlanManage();
}
function closePanel(){ document.getElementById('overlay').classList.add('hide'); }

/* ---- メイン画面：宛先 ---- */
function renderTo(){
  const w = document.getElementById('toRow');
  w.innerHTML = '';
  st.groups.forEach(g=>{
    const on = st.selGroups.includes(g);
    const b = document.createElement('button');
    b.className = 'btn grp' + (on ? ' sel' : '');
    const cnt = g.members.filter(m=>m.email).length;
    b.textContent = '👥 ' + (g.name || 'グループ') + ' (' + cnt + ')';
    b.onclick = ()=>{
      if(on) st.selGroups = st.selGroups.filter(x=>x!==g); else st.selGroups.push(g);
      renderTo();
    };
    w.appendChild(b);
  });
  st.addresses.forEach(a=>{
    const on = st.selTo.includes(a);
    const b = document.createElement('button');
    b.className = 'btn' + (on ? ' sel' : '');
    b.textContent = a.label + (a.email ? '' : '(未)');
    b.onclick = ()=>{
      if(on) st.selTo = st.selTo.filter(x=>x!==a); else st.selTo.push(a);
      renderTo();
    };
    w.appendChild(b);
  });
  update();
}
function renderCc(){
  const w = document.getElementById('ccRow');
  w.innerHTML = '';
  if(!st.ccAddresses.length){
    w.innerHTML = '<span style="font-size:12px;color:var(--sub);">未登録</span>';
    update(); return;
  }
  st.ccAddresses.forEach(a=>{
    const on = st.selCc.includes(a);
    const b = document.createElement('button');
    b.className = 'btn' + (on ? ' sel' : '');
    b.textContent = a.label + (a.email ? '' : '(未)');
    b.onclick = ()=>{
      if(on) st.selCc = st.selCc.filter(x=>x!==a); else st.selCc.push(a);
      renderCc();
    };
    w.appendChild(b);
  });
  update();
}

/* ---- グループ管理 ---- */
function renderGroupManage(){
  const w = document.getElementById('groupManage');
  w.innerHTML = '';
  if(!st.groups.length){
    w.innerHTML = '<div style="font-size:12px;color:var(--sub);padding:4px 0;">グループは未作成です。</div>';
    return;
  }
  st.groups.forEach((g,gi)=>{
    const box = document.createElement('div');
    box.className = 'gbox';

    const head = document.createElement('div');
    head.className = 'ghead';
    const nameIn = document.createElement('input');
    nameIn.type = 'text';
    nameIn.placeholder = 'グループ名（例：課内）';
    nameIn.value = g.name || '';
    nameIn.addEventListener('input', e=>{
      g.name = e.target.value; saveGroups(); renderTo();
    });
    const delB = document.createElement('button');
    delB.className = 'xbtn';
    delB.textContent = '削除';
    delB.onclick = ()=>{
      if(!confirm('グループ「'+(g.name||'')+'」を削除しますか？')) return;
      st.selGroups = st.selGroups.filter(x=>x!==g);
      st.groups.splice(gi,1);
      saveGroups(); renderGroupManage(); renderTo();
    };
    head.appendChild(nameIn); head.appendChild(delB);
    box.appendChild(head);

    if(!g.members.length){
      const e = document.createElement('div');
      e.style.cssText = 'font-size:12px;color:var(--sub);margin-bottom:6px;';
      e.textContent = 'メンバーがいません。下のボタンで追加してください。';
      box.appendChild(e);
    }
    g.members.forEach((m,mi)=>{
      const row = document.createElement('div');
      row.className = 'mem';
      const s = document.createElement('span');
      s.textContent = (m.label || '') + '　' + (m.email || '(未設定)');
      const x = document.createElement('button');
      x.textContent = '✕';
      x.onclick = ()=>{ g.members.splice(mi,1); saveGroups(); renderGroupManage(); renderTo(); };
      row.appendChild(s); row.appendChild(x);
      box.appendChild(row);
    });

    const pick = document.createElement('button');
    pick.className = 'dash';
    pick.textContent = '📱 アドレス帳から複数選ぶ';
    pick.onclick = ()=> pickForGroup(g);
    box.appendChild(pick);

    const man = document.createElement('button');
    man.className = 'dash';
    man.textContent = '＋ 手入力で追加';
    man.onclick = ()=>{
      const em = prompt('メールアドレスを入力してください');
      if(!em) return;
      const nm = prompt('表示名（省略可）') || em.split('@')[0];
      g.members.push({label:nm, email:em.trim()});
      saveGroups(); renderGroupManage(); renderTo();
    };
    box.appendChild(man);

    w.appendChild(box);
  });
}
function addGroup(){
  const nm = prompt('グループ名を入力してください（例：課内）');
  if(nm === null) return;
  st.groups.push({name: nm || 'グループ'+(st.groups.length+1), members:[]});
  saveGroups(); renderGroupManage(); renderTo();
}
async function pickForGroup(g){
  if(!('contacts' in navigator) || !('ContactsManager' in window)){
    alert('この端末・ブラウザではアドレス帳を呼び出せません。「手入力で追加」をご利用ください。');
    return;
  }
  try{
    const cs = await navigator.contacts.select(['name','email'], {multiple:true});
    if(!cs || !cs.length) return;
    let added = 0;
    cs.forEach(c=>{
      const label = (c.name && c.name[0]) ? c.name[0] : 'アドレス帳';
      const emails = (c.email && c.email.length) ? c.email : [];
      emails.slice(0,1).forEach(em=>{
        if(!em) return;
        if(g.members.some(m=>m.email === em)) return;
        g.members.push({label, email:em});
        added++;
      });
    });
    saveGroups(); renderGroupManage(); renderTo();
    if(added === 0) alert('メールアドレスが登録された連絡先が選ばれませんでした。');
  }catch(e){
    alert('アドレス帳の読み込みに失敗しました。');
  }
}

/* ---- 個別宛先・CC管理 ---- */
function renderAddrManage(){
  const w = document.getElementById('addrManage');
  w.innerHTML = '';
  st.addresses.forEach((a,i)=>{
    const r = document.createElement('div');
    r.className = 'addr-row';
    r.innerHTML =
      '<input type="text" placeholder="名称" value="'+a.label.replace(/"/g,'&quot;')+'" data-i="'+i+'" data-f="label">'+
      '<input type="email" placeholder="メールアドレス" value="'+a.email.replace(/"/g,'&quot;')+'" data-i="'+i+'" data-f="email">'+
      '<button class="xbtn" onclick="delAddr('+i+')">✕</button>';
    w.appendChild(r);
  });
  w.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      st.addresses[+e.target.dataset.i][e.target.dataset.f] = e.target.value;
      saveAddr(); renderTo();
    });
  });
}
function addAddr(){
  st.addresses.push({label:"宛先"+(st.addresses.length+1), email:""});
  saveAddr(); renderAddrManage(); renderTo();
}
function delAddr(i){
  st.addresses.splice(i,1);
  if(!st.addresses.length) st.addresses.push({label:"宛先1", email:""});
  st.selTo = st.selTo.filter(x=>st.addresses.includes(x));
  saveAddr(); renderAddrManage(); renderTo();
}
function renderCcManage(){
  const w = document.getElementById('ccManage');
  w.innerHTML = '';
  st.ccAddresses.forEach((a,i)=>{
    const r = document.createElement('div');
    r.className = 'addr-row';
    r.innerHTML =
      '<input type="text" placeholder="名称" value="'+a.label.replace(/"/g,'&quot;')+'" data-i="'+i+'" data-f="label">'+
      '<input type="email" placeholder="メールアドレス" value="'+a.email.replace(/"/g,'&quot;')+'" data-i="'+i+'" data-f="email">'+
      '<button class="xbtn" onclick="delCc('+i+')">✕</button>';
    w.appendChild(r);
  });
  w.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      st.ccAddresses[+e.target.dataset.i][e.target.dataset.f] = e.target.value;
      saveCc(); renderCc();
    });
  });
}
function addCc(){
  st.ccAddresses.push({label:"CC"+(st.ccAddresses.length+1), email:""});
  saveCc(); renderCcManage(); renderCc();
}
function delCc(i){
  const rm = st.ccAddresses[i];
  st.ccAddresses.splice(i,1);
  st.selCc = st.selCc.filter(x=>x!==rm);
  saveCc(); renderCcManage(); renderCc();
}
async function pickContacts(target){
  if(!('contacts' in navigator) || !('ContactsManager' in window)){
    alert('この端末・ブラウザではアドレス帳を呼び出せません。手動で入力してください。');
    return;
  }
  try{
    const cs = await navigator.contacts.select(['name','email'], {multiple:true});
    if(!cs || !cs.length) return;
    cs.forEach(c=>{
      const label = (c.name && c.name[0]) ? c.name[0] : 'アドレス帳';
      const email = (c.email && c.email[0]) ? c.email[0] : '';
      if(!email) return;
      if(target==='to') st.addresses.push({label,email});
      else st.ccAddresses.push({label,email});
    });
    if(target==='to'){ saveAddr(); renderAddrManage(); renderTo(); }
    else { saveCc(); renderCcManage(); renderCc(); }
  }catch(e){
    alert('アドレス帳の読み込みに失敗しました。');
  }
}

/* ---- バックアップ ---- */
function doExport(){
  document.getElementById('ioBox').value = JSON.stringify({
    version:2, name:st.name, addresses:st.addresses,
    groups:st.groups, ccAddresses:st.ccAddresses
  });
  alert('書き出しました。下のテキストをコピーして保管してください。');
}
function doImport(){
  const t = document.getElementById('ioBox').value.trim();
  if(!t){ alert('バックアップしたテキストを貼り付けてください。'); return; }
  let d;
  try{ d = JSON.parse(t); }catch(e){ alert('形式が正しくありません。'); return; }
  if(typeof d.name === 'string'){
    st.name = d.name;
    document.getElementById('nameInput').value = d.name;
    lsSet('userName', d.name);
  }
  if(Array.isArray(d.addresses) && d.addresses.length){
    st.addresses = d.addresses; st.selTo = [st.addresses[0]]; saveAddr();
  }
  if(Array.isArray(d.groups)){
    st.groups = d.groups; st.selGroups = []; saveGroups();
  }
  if(Array.isArray(d.ccAddresses)){
    st.ccAddresses = d.ccAddresses; st.selCc = []; saveCc();
  }
  renderAddrManage(); renderCcManage(); renderGroupManage(); renderPlanManage(); renderTo(); renderCc();
  alert('復元しました。');
}
function copyBox(){
  const b = document.getElementById('ioBox');
  if(!b.value.trim()){ alert('先に「エクスポート」を押してください。'); return; }
  b.select();
  try{ navigator.clipboard.writeText(b.value); }catch(e){ document.execCommand('copy'); }
  alert('コピーしました。');
}

/* ---- 選択 ---- */
function selType(t){
  st.type = t;
  document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('sel', b.dataset.type===t));
  document.getElementById('timeCard').classList.toggle('hide', t!=='遅刻');
  document.getElementById('eventCard').classList.toggle('hide', t!=='欠席');
  resetWarn();
  update();
}
function selReason(r){
  st.reason = r;
  document.querySelectorAll('[data-reason]').forEach(b=>b.classList.toggle('sel', b.dataset.reason===r));
  update();
}
function selApo(v){
  st.apo = v;
  document.querySelectorAll('[data-apo]').forEach(b=>b.classList.toggle('sel', b.dataset.apo===v));
  update();
}

/* ---- 予定 ---- */
function buildPlanSelect(){
  const sel = document.getElementById('planSel');
  const cur = st.plan;
  sel.innerHTML = '<option value="">（指定なし）</option>';
  st.plans.forEach(p=>{
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    sel.appendChild(o);
  });
  sel.value = st.plans.includes(cur) ? cur : '';
  st.plan = sel.value;
  sel.onchange = e=>{ st.plan = e.target.value; resetWarn(); update(); };
}
function renderPlanManage(){
  const w = document.getElementById('planManage');
  w.innerHTML = '';
  if(!st.plans.length){
    w.innerHTML = '<div style="font-size:12px;color:var(--sub);">項目がありません。</div>';
    return;
  }
  st.plans.forEach((p,i)=>{
    const r = document.createElement('div');
    r.className = 'addr-row';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.value = p;
    inp.addEventListener('input', e=>{
      st.plans[i] = e.target.value; savePlans(); buildPlanSelect();
    });
    const x = document.createElement('button');
    x.className = 'xbtn'; x.textContent = '✕';
    x.onclick = ()=>{ st.plans.splice(i,1); savePlans(); renderPlanManage(); buildPlanSelect(); update(); };
    r.appendChild(inp); r.appendChild(x);
    w.appendChild(r);
  });
}
function addPlan(){
  const v = prompt('追加する項目名を入力してください（例：面談）');
  if(!v) return;
  st.plans.push(v.trim());
  savePlans(); renderPlanManage(); buildPlanSelect();
}

/* ---- 時刻 ---- */
function buildTime(){
  const h = document.getElementById('hourSel');
  h.innerHTML = '<option value="">--</option>';
  for(let i=0;i<24;i++){
    const o=document.createElement('option'); o.value=i; o.textContent=i+'時'; h.appendChild(o);
  }
  h.onchange = e=>{ st.hour = e.target.value; resetWarn(); update(); };
  const m = document.getElementById('minSel');
  m.innerHTML = '<option value="">--</option>';
  [0,15,30,45].forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=String(v).padStart(2,'0')+'分'; m.appendChild(o);
  });
  m.onchange = e=>{ st.minute = e.target.value; resetWarn(); update(); };
}
function resetWarn(){ st.warnMail = false; st.warnLine = false; }

function timeStr(){
  if(st.hour===''||st.minute==='') return null;
  return st.hour + ':' + String(st.minute).padStart(2,'0');
}

/* ---- 宛先集約 ---- */
function toEmails(){
  const list = [];
  st.selGroups.forEach(g=>{
    g.members.forEach(m=>{ if(m.email) list.push(m.email); });
  });
  st.selTo.forEach(a=>{ if(a.email) list.push(a.email); });
  return list.filter((v,i)=>list.indexOf(v)===i);
}

/* ---- 本文 ---- */
function body(){
  const t = timeStr();
  const g = 'お疲れさまです。' + (st.name || '〇〇') + 'です。';
  const ap = st.apo==='あり' ? '\nご迷惑をおかけし申し訳ございません。' : '';
  const r = st.reason;
  let m;
  if(st.type==='遅刻'){
    const pl = st.plan ? st.plan + '、' : '';
    if(t){
      m = (r==='理由なし') ? '本日、'+pl+t+'頃に出社いたします。' : '本日、'+r+'のため'+pl+t+'頃に出社いたします。';
    } else {
      m = (r==='理由なし')
        ? '本日、遅れて出社いたします。出社時刻は追ってご連絡いたします。'
        : '本日、'+r+'のため遅れて出社いたします。出社時刻は追ってご連絡いたします。';
    }
  } else if(st.type==='欠勤'){
    m = (r==='理由なし') ? '本日、お休みをいただきます。' : '本日、'+r+'のためお休みをいただきます。';
  } else {
    const ev = st.event || '本日の会議';
    m = (r==='理由なし') ? ev+'を欠席させていただきます。' : r+'のため、'+ev+'を欠席させていただきます。';
  }
  return g+'\n'+m+ap+'\nよろしくお願いいたします。';
}
function subject(){
  return st.type==='遅刻' ? '遅刻のご連絡' : (st.type==='欠勤' ? '欠勤のご連絡' : '欠席のご連絡');
}
function currentBody(){
  const box = document.getElementById('bodyBox');
  return (st.bodyEdited && box.value.trim()) ? box.value : body();
}
function resetBody(){
  st.bodyEdited = false;
  document.getElementById('bodyBox').value = body();
  document.getElementById('editState').textContent = '自動生成中（直接編集できます）';
}

function update(){
  const tl = toEmails();
  let to;
  if(!tl.length) to = '（未選択）';
  else if(tl.length <= 3) to = tl.join(', ');
  else to = tl.slice(0,2).join(', ') + ' ほか' + (tl.length-2) + '名（計' + tl.length + '名）';
  const cc = st.selCc.map(c=>c.email).filter(Boolean).join(', ');
  document.getElementById('preview').innerHTML =
    '<b>宛先：</b>'+to+'\n<b>CC：</b>'+(cc||'なし')+'\n<b>件名：</b>'+subject();
  if(!st.bodyEdited){
    document.getElementById('bodyBox').value = body();
  }
}

/* ---- 送信 ---- */
function sendMail(){
  const tl = toEmails();
  if(!tl.length){ alert('宛先が選択されていません。右上の⋯から登録し、宛先またはグループを選んでください。'); openPanel(); return; }
  if(st.type==='遅刻' && (st.hour===''||st.minute==='') && !st.warnMail){
    st.warnMail = true;
    alert('出社予定時刻が未選択です。\n\nこのまま送る場合は、もう一度ボタンを押してください。\n（「出社時刻は追ってご連絡いたします」という文面になります）');
    return;
  }
  const cc = st.selCc.map(c=>c.email).filter(Boolean);
  const ccP = cc.length ? '&cc='+encodeURIComponent(cc.join(',')) : '';
  window.location.href = 'mailto:'+encodeURIComponent(tl.join(','))+'?subject='+encodeURIComponent(subject())+ccP+'&body='+encodeURIComponent(currentBody());
}

/* ---- LINE ---- */
function copyBody(){
  const t = currentBody();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(
      ()=>alert('本文をコピーしました。LINEを開いてトークに貼り付けてください。'),
      ()=>fallbackCopy(t)
    );
  } else {
    fallbackCopy(t);
  }
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand('copy'); alert('本文をコピーしました。LINEを開いてトークに貼り付けてください。'); }
  catch(e){ alert('コピーできませんでした。プレビューの文章を手動で選択してコピーしてください。'); }
  document.body.removeChild(ta);
}
function sendLine(){
  if(st.type==='遅刻' && (st.hour===''||st.minute==='') && !st.warnLine){
    st.warnLine = true;
    alert('出社予定時刻が未選択です。\n\nこのまま送る場合は、もう一度ボタンを押してください。\n（「出社時刻は追ってご連絡いたします」という文面になります）');
    return;
  }
  const t = currentBody();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).catch(()=>{});
  }
  window.location.href = 'https://line.me/R/share?text=' + encodeURIComponent(t);
}

/* ---- 起動 ---- */
buildTime();
loadAll();
document.getElementById('nameInput').addEventListener('input', e=>{
  st.name = e.target.value; lsSet('userName', e.target.value); update();
});
document.getElementById('eventInput').addEventListener('input', e=>{
  st.event = e.target.value; update();
});
document.getElementById('bodyBox').addEventListener('input', ()=>{
  st.bodyEdited = true;
  document.getElementById('editState').textContent = '✏️ 編集済み（この内容で送信されます）';
});
update();
</script>

</body>
</html>
